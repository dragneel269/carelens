[project]
name = "carelens-backend"
version = "0.1.0"
description = "CareLens unified clinical view backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "argon2-cffi>=25.1.0",
    "faker>=40.43.0",
    "fastapi>=0.143.0",
    "jellyfish>=1.2.1",
    "pyjwt>=2.15.1",
    "rapidfuzz>=3.14.6",
    "sqlmodel>=0.0.48",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
